# Development example: replace YOUR_* and REPLACE_WITH_* before submitting.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: byob-remote-
spec:
  taskRunTemplate:
    serviceAccountName: byob-build
  pipelineRef:
    name: byob-remote
  params:
  - name: git-url
    value: https://github.com/YOUR_ORG/YOUR_COMPONENT
  - name: revision
    value: REPLACE_WITH_COMMIT_SHA
  - name: output-image
    value: quay.io/YOUR_ORG/component:REPLACE_WITH_UNIQUE_BUILD_TAG
  - name: oci-storage
    value: quay.io/YOUR_ORG/component-ta
