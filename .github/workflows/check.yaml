name: Check catalog
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/tekton/go.sum
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make check
