name: System tests
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: system-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  system-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/hostedtoolcache
          sudo docker image prune -af
          df -h
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/system/go.sum
      - name: Install kind and kubectl
        run: |
          set -eu
          curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSL -o /tmp/kubectl https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client
      - name: Install rootless Podman
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns
          user="$(id -un)"
          grep -q "^${user}:" /etc/subuid || echo "${user}:100000:65536" | sudo tee -a /etc/subuid
          grep -q "^${user}:" /etc/subgid || echo "${user}:100000:65536" | sudo tee -a /etc/subgid
          mkdir -p "${HOME}/.config/containers"
          printf '%s\n' \
            '[engine]' \
            'cgroup_manager = "cgroupfs"' \
            'events_logger = "file"' \
            > "${HOME}/.config/containers/containers.conf"
          podman info
      - uses: actions/checkout@v4
        with:
          repository: konflux-ci/konflux-ci
          ref: v0.2.2
          path: konflux-ci
      - name: Deploy Konflux on Kind
        working-directory: konflux-ci
        env:
          # Kind uses the runner's Docker. Podman is only for the Makefile image.
          CONTAINER_TOOL: docker
          KIND_CLUSTER: konflux
          OPERATOR_INSTALL_METHOD: release
          OPERATOR_RELEASE: v0.2.2
          SKIP_SECRETS: "true"
        run: ./scripts/deploy-local.sh
      - name: Run system tests
        env:
          BYOB_CLUSTER: existing
          BYOB_KIND_CLUSTER: konflux
          BYOB_GIT_URL: https://github.com/gbenhaim/byob-system-fixture
          BYOB_GIT_REF: main
          GIT_TERMINAL_PROMPT: "0"
        run: make system-test
