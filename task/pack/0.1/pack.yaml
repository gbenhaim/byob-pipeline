apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pack
  labels:
    app.kubernetes.io/version: 0.1.0
  annotations:
    tekton.dev/pipelines.minVersion: 1.16.0
spec:
  description: Pack one or several build outputs into an OCI artifact.
  params:
  - name: BUILD_ARTIFACTS
    type: array
    description: Build output Trusted Artifacts containing out/ and optional platform metadata.
  - name: IMAGE
    type: string
    description: Tagged destination for the component build artifact.
  - name: artifactType
    type: string
    description: OCI artifactType for the documented output format.
    default: application/vnd.konflux.build-output.v1
  - name: layout
    type: string
    description: 'Platform-owned output layout: flat or platform.'
    default: flat
  results:
  - name: IMAGE_URL
    type: string
    value: $(steps.publish.results.IMAGE_URL)
  - name: IMAGE_DIGEST
    type: string
    value: $(steps.publish.results.IMAGE_DIGEST)
  stepTemplate:
    securityContext:
      runAsUser: 1000
      runAsGroup: 0
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  volumes:
  - name: workdir
    emptyDir: {}
  - name: registry-auth
    secret:
      secretName: byob-registry-auth
      optional: true
      items:
      - key: .dockerconfigjson
        path: config.json
  steps:
  - name: restore
    image: localhost/byob-cli:devel
    args:
    - restore-inputs
    - --root=/var/workdir/inputs
    - --require
    - --
    - $(params.BUILD_ARTIFACTS[*])
    env:
    - name: AUTHFILE
      value: /var/run/byob-registry-auth/config.json
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
    - name: registry-auth
      mountPath: /var/run/byob-registry-auth
      readOnly: true
    command:
    - /usr/local/bin/byob
  - name: prepare
    image: localhost/byob-cli:devel
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
    command:
    - /usr/local/bin/byob
    args:
    - pack
    - --inputs=/var/workdir/inputs
    - --package=/var/workdir/package
    - --archive=/var/workdir/payload.tar.gz
    - --layout=$(params.layout)
  - name: publish
    image: localhost/byob-cli:devel
    workingDir: /var/workdir
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
    - name: registry-auth
      mountPath: /var/run/byob-registry-auth
      readOnly: true
    results:
    - name: IMAGE_URL
      type: string
    - name: IMAGE_DIGEST
      type: string
    command:
    - /usr/local/bin/byob
    args:
    - publish
    - --workdir=/var/workdir
    - --image=$(params.IMAGE)
    - --artifact-type=$(params.artifactType)
    - --auth-dir=/var/run/byob-registry-auth
    - --url-result=$(step.results.IMAGE_URL.path)
    - --digest-result=$(step.results.IMAGE_DIGEST.path)
