apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-build
  labels:
    app.kubernetes.io/version: 0.1.0
  annotations:
    tekton.dev/pipelines.minVersion: 1.16.0
spec:
  description: Execute a repository script in a non-root developer image and export the modified source
    as a Trusted Artifact.
  params:
  - name: image
    type: string
    description: Digest-pinned developer image, with /bin/sh and the script interpreter.
    default: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
  - name: script-path
    type: string
    description: Executable script path relative to the source tree.
    default: build.sh
  - name: SOURCE_ARTIFACT
    type: string
    description: Source Trusted Artifact from the preceding task.
  - name: ociStorage
    type: string
    description: Platform-owned OCI repository (without a tag) for handoffs.
  - name: ociArtifactExpiresAfter
    type: string
    description: Optional Trusted Artifact retention period.
    default: ''
  results:
  - name: SOURCE_ARTIFACT
    type: string
    description: Modified source tree.
    value: $(steps.export.results.SOURCE_ARTIFACT)
  stepTemplate:
    securityContext:
      runAsUser: 1000
      runAsGroup: 0
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  volumes:
  - name: workdir
    emptyDir: {}
  - name: registry-auth
    secret:
      secretName: byob-registry-auth
      optional: true
      items:
      - key: .dockerconfigjson
        path: config.json
  steps:
  - name: restore
    image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:adf22f3ec90bfa3f7e2c832a7d52febd1ea31aa9fff6db21324c965d7d622327
    args:
    - use
    - $(params.SOURCE_ARTIFACT)=/var/workdir/source
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
    - name: registry-auth
      mountPath: /var/run/byob-registry-auth
      readOnly: true
    env:
    - name: AUTHFILE
      value: /var/run/byob-registry-auth/config.json
  - name: prepare
    image: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
    script: |
      #!/usr/bin/env python3
      """Validate source in a trusted image, never in the developer image."""
      import os
      from pathlib import Path
      import re
      import sys

      import stat


      def safe_relative(value):
          path = Path(value)
          if not value or path.is_absolute() or ".." in path.parts:
              raise ValueError(f"expected a relative path without '..': {value!r}")
          return path


      def check_tree(root):
          if root.is_symlink() or not root.is_dir():
              raise ValueError(f"expected a real directory: {root}")
          root = root.resolve(strict=True)
          for directory, dirs, files in os.walk(root, followlinks=False):
              for name in dirs + files:
                  path = Path(directory) / name
                  mode = path.lstat().st_mode
                  if stat.S_ISLNK(mode):
                      # Absolute links would point somewhere different after extraction.
                      target = os.readlink(path)
                      if os.path.isabs(target) or not path.resolve().is_relative_to(root):
                          raise ValueError(f"symlink escapes artifact: {path}")
                  elif not (stat.S_ISREG(mode) or stat.S_ISDIR(mode)):
                      raise ValueError(f"unsupported special file: {path}")



      def main():
          source = Path(os.environ["SOURCE_ROOT"])
          mode = os.environ["MODE"]
          marker = source / ".konflux-platform"
          if mode == "export" and (marker.exists() or marker.is_symlink()):
              # Never follow an attacker-supplied marker, including a dangling symlink.
              marker.unlink()
          check_tree(source)
          if (source / ".skip-trusted-artifacts").exists():
              raise ValueError("source must not disable Trusted Artifact publication")
          if mode == "prepare":
              relative = safe_relative(os.environ["SCRIPT_PATH"])
              script = (source / relative).resolve(strict=True)
              if not script.is_relative_to(source.resolve()) or not script.is_file():
                  raise ValueError("script must be a file inside the source tree")
              if not os.access(script, os.X_OK):
                  raise ValueError("script must be executable and have an interpreter shebang")
              with script.open("rb") as contents:
                  if contents.read(2) != b"#!":
                      raise ValueError("script must have an interpreter shebang")
          elif mode == "export":
              platform = os.environ.get("BUILD_PLATFORM", "")
              if platform:
                  if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_./-]*", platform):
                      raise ValueError("invalid platform label")
                  safe_relative(platform)
                  marker.write_text(platform + "\n")
          else:
              raise ValueError(f"unknown validation mode: {mode}")


      if __name__ == "__main__":
          try:
              main()
          except (OSError, ValueError, RuntimeError) as error:
              sys.exit(f"source validation failed: {error}")
    env:
    - name: SOURCE_ROOT
      value: /var/workdir/source
    - name: MODE
      value: prepare
    - name: SCRIPT_PATH
      value: $(params.script-path)
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
  - name: build
    image: $(params.image)
    command:
    - /bin/sh
    args:
    - -eu
    - -c
    - mkdir -p "$HOME"; cd source; exec "./$1"
    - run-build
    - $(params.script-path)
    workingDir: /var/workdir
    env:
    - name: HOME
      value: /tmp/byob-home
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
    computeResources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        memory: 2Gi
  - name: validate-output
    image: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
    script: |
