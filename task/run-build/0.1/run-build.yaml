apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-build
  labels:
    app.kubernetes.io/version: 0.1.0
  annotations:
    tekton.dev/pipelines.minVersion: 1.16.0
spec:
  description: Execute a build command in a non-root developer image and export only BUILD_OUTPUT as a Trusted Artifact.
  params:
  - name: image
    type: string
    description: Digest-pinned developer image containing the requested build executable.
    default: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
  - name: build-cmd
    type: array
    description: Executable and fixed arguments, run directly without a shell.
    default:
    - ./build.sh
  - name: build-args
    type: array
    description: Additional arguments appended to build-cmd without shell parsing.
    default: []
  - name: SOURCE_ARTIFACT
    type: string
    description: Original checkout Trusted Artifact, restored independently for every build.
  - name: BUILD_ARTIFACTS
    type: array
    description: Preceding build outputs, restored under BUILD_INPUTS/<task>/out/. Name each entry task=reference.
    default: []
  - name: ociStorage
    type: string
    description: Platform-owned OCI repository (without a tag) for handoffs.
  - name: ociArtifactExpiresAfter
    type: string
    description: Optional Trusted Artifact retention period.
    default: ''
  results:
  - name: BUILD_ARTIFACT
    type: string
    description: Build outputs from BUILD_OUTPUT, stored under out/, with optional platform metadata.
    value: $(steps.export.results.BUILD_ARTIFACT)
  stepTemplate:
    securityContext:
      runAsUser: 1000
      runAsGroup: 0
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  volumes:
  - name: source
    emptyDir: {}
  - name: workdir
    emptyDir: {}
  - name: build-output
    emptyDir: {}
  - name: user-output
    emptyDir: {}
  - name: registry-auth
    secret:
      secretName: byob-registry-auth
      optional: true
      items:
      - key: .dockerconfigjson
        path: config.json
  - name: trusted-ca
    configMap:
      name: trusted-ca
      optional: true
      items:
      - key: ca-bundle.crt
        path: ca-bundle.crt
  steps:
  # The emptyDir mount is owned by root. use-archive preserves directory
  # metadata, so uid 1000 must own the mount before restore.
  - name: prepare-source
    image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:adf22f3ec90bfa3f7e2c832a7d52febd1ea31aa9fff6db21324c965d7d622327
    command:
    - /bin/sh
    args:
    - -c
    - |
      printf 'Giving uid 1000 ownership of /var/source\n' >&2
      /bin/chown 1000:0 /var/source
      printf 'Giving uid 1000 ownership of /var/byob/output\n' >&2
      /bin/chown 1000:0 /var/byob/output
      printf 'Prepared /var/source and /var/byob/output\n' >&2
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: false
      capabilities:
        add:
        - CHOWN
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
    - name: source
      mountPath: /var/source
    - name: user-output
      mountPath: /var/byob/output
  - name: prepare
    image: localhost/byob-cli:devel
    command:
    - /usr/local/bin/byob
    args:
    - prepare
    - --source-artifact=$(params.SOURCE_ARTIFACT)
    - --inputs=/var/workdir/inputs
    - --source=/var/source
    - --home=/var/workdir/home
    - --command-file=/var/workdir/control/build-cmd
    - --
    - $(params.build-cmd[*])
    - --artifacts
    - $(params.BUILD_ARTIFACTS[*])
    env:
    - name: AUTHFILE
      value: /var/run/byob-registry-auth/config.json
    - name: CA_FILE
      value: /etc/pki/tls/certs/ca-custom-bundle.crt
    volumeMounts:
    - name: source
      mountPath: /var/source
    - name: workdir
      mountPath: /var/workdir
    - name: registry-auth
      mountPath: /var/run/byob-registry-auth
      readOnly: true
    - name: trusted-ca
      mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
      subPath: ca-bundle.crt
      readOnly: true
  - name: build
    image: $(params.image)
    command:
    - $(params.build-cmd[*])
    args:
    - $(params.build-args[*])
    workingDir: /var/source
    env:
    - name: HOME
      value: /var/workdir/home
    - name: BUILD_INPUTS
      value: /var/workdir/inputs
    - name: BUILD_OUTPUT
      value: /var/byob/output
    volumeMounts:
    - name: source
      mountPath: /var/source
    - name: workdir
      mountPath: /var/workdir
    - name: user-output
      mountPath: /var/byob/output
    computeResources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        memory: 2Gi
  - name: validate-output
    image: localhost/byob-cli:devel
    volumeMounts:
    - name: user-output
      mountPath: /var/byob/output
      readOnly: true
    - name: build-output
      mountPath: /var/build-output
    command:
    - /usr/local/bin/byob
    args:
    - stage-output
    - --build-output=/var/byob/output
    - --output=/var/build-output
  - name: export
    image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:adf22f3ec90bfa3f7e2c832a7d52febd1ea31aa9fff6db21324c965d7d622327
    command:
    - /bin/sh
    args:
    - -c
    - |
      printf 'Exporting build output to %s\n' "$3" >&2
      /usr/local/bin/entrypoint "$@"
      status=$?
      if [ "$status" -eq 0 ]; then
        printf 'Exported build output to %s\n' "$3" >&2
      fi
      exit "$status"
    - export
    - create
    - --store
    - $(params.ociStorage):$(context.taskRun.name)
    - $(step.results.BUILD_ARTIFACT.path)=/var/build-output
    results:
    - name: BUILD_ARTIFACT
      type: string
    env:
    - name: AUTHFILE
      value: /var/run/byob-registry-auth/config.json
    - name: CA_FILE
      value: /etc/pki/tls/certs/ca-custom-bundle.crt
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.ociArtifactExpiresAfter)
    volumeMounts:
    - name: build-output
      mountPath: /var/build-output
      readOnly: true
    - name: registry-auth
      mountPath: /var/run/byob-registry-auth
      readOnly: true
    - name: trusted-ca
      mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
      subPath: ca-bundle.crt
      readOnly: true
