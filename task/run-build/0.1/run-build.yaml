apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-build
  labels:
    app.kubernetes.io/version: 0.1.0
  annotations:
    tekton.dev/pipelines.minVersion: 1.16.0
spec:
  description: Execute a repository script in a non-root developer image and export only out/ as a Trusted Artifact.
  params:
  - name: image
    type: string
    description: Digest-pinned developer image containing the requested build executable.
    default: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
  - name: build-cmd
    type: array
    description: Executable and arguments, run directly from the source directory without a shell.
    default:
    - ./build.sh
  - name: SOURCE_ARTIFACT
    type: string
    description: Original checkout Trusted Artifact, restored independently for every build.
  - name: BUILD_ARTIFACTS
    type: array
    description: Preceding build outputs, restored under BUILD_INPUTS/<index>/out/ in array order.
    default: []
  - name: ociStorage
    type: string
    description: Platform-owned OCI repository (without a tag) for handoffs.
  - name: ociArtifactExpiresAfter
    type: string
    description: Optional Trusted Artifact retention period.
    default: ''
  results:
  - name: BUILD_ARTIFACT
    type: string
    description: Build outputs under out/, with optional platform metadata.
    value: $(steps.export.results.BUILD_ARTIFACT)
  stepTemplate:
    securityContext:
      runAsUser: 1000
      runAsGroup: 0
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  volumes:
  - name: workdir
    emptyDir: {}
  - name: build-output
    emptyDir: {}
  - name: build-tools
    emptyDir: {}
  - name: registry-auth
    secret:
      secretName: byob-registry-auth
      optional: true
      items:
      - key: .dockerconfigjson
        path: config.json
  steps:
  - name: restore
    image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:adf22f3ec90bfa3f7e2c832a7d52febd1ea31aa9fff6db21324c965d7d622327
    args:
    - use
    - $(params.SOURCE_ARTIFACT)=/var/workdir/source
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
    - name: registry-auth
      mountPath: /var/run/byob-registry-auth
      readOnly: true
    env:
    - name: AUTHFILE
      value: /var/run/byob-registry-auth/config.json
  - name: restore-inputs
    image: localhost/byob-cli:devel
    args:
    - restore-inputs
    - --root=/var/workdir/inputs
    - --
    - $(params.BUILD_ARTIFACTS[*])
    env:
    - name: AUTHFILE
      value: /var/run/byob-registry-auth/config.json
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
    - name: registry-auth
      mountPath: /var/run/byob-registry-auth
      readOnly: true
    command:
    - /usr/local/bin/byob
  - name: prepare
    image: localhost/byob-cli:devel
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
    - name: build-tools
      mountPath: /var/build-tools
    command:
    - /usr/local/bin/byob
    args:
    - prepare
    - --source=/var/workdir/source
    - --tools=/var/build-tools
  - name: build
    image: $(params.image)
    command:
    - /var/build-tools/byob
    args:
    - exec-build
    - --source=/var/workdir/source
    - --home=/var/workdir/home
    - --
    - $(params.build-cmd[*])
    workingDir: /var/workdir
    env:
    - name: HOME
      value: /var/workdir/home
    - name: BUILD_INPUTS
      value: /var/workdir/inputs
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
    - name: build-tools
      mountPath: /var/build-tools
      readOnly: true
    computeResources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        memory: 2Gi
  - name: validate-output
    image: localhost/byob-cli:devel
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
      readOnly: true
    - name: build-output
      mountPath: /var/build-output
    command:
    - /usr/local/bin/byob
    args:
    - stage-output
    - --source=/var/workdir/source
    - --output=/var/build-output
  - name: export
    image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:adf22f3ec90bfa3f7e2c832a7d52febd1ea31aa9fff6db21324c965d7d622327
    args:
    - create
    - --store
    - $(params.ociStorage):$(context.taskRun.name)
    - $(step.results.BUILD_ARTIFACT.path)=/var/build-output
    results:
    - name: BUILD_ARTIFACT
      type: string
    env:
    - name: AUTHFILE
      value: /var/run/byob-registry-auth/config.json
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.ociArtifactExpiresAfter)
    volumeMounts:
    - name: build-output
      mountPath: /var/build-output
      readOnly: true
    - name: registry-auth
      mountPath: /var/run/byob-registry-auth
      readOnly: true
