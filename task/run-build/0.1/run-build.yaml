apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-build
  labels:
    app.kubernetes.io/version: 0.1.0
  annotations:
    tekton.dev/pipelines.minVersion: 1.16.0
spec:
  description: Execute a repository script in a non-root developer image and export only out/ as a Trusted
    Artifact.
  params:
  - name: image
    type: string
    description: Digest-pinned developer image, with /bin/sh and the script interpreter.
    default: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
  - name: script-path
    type: string
    description: Executable script path relative to the source tree.
    default: build.sh
  - name: SOURCE_ARTIFACT
    type: string
    description: Original checkout Trusted Artifact, restored independently for every build.
  - name: BUILD_ARTIFACTS
    type: array
    description: Preceding build outputs, restored under BUILD_INPUTS/<index>/out/ in array order.
    default: []
  - name: ociStorage
    type: string
    description: Platform-owned OCI repository (without a tag) for handoffs.
  - name: ociArtifactExpiresAfter
    type: string
    description: Optional Trusted Artifact retention period.
    default: ''
  results:
  - name: BUILD_ARTIFACT
    type: string
    description: Build outputs under out/, with optional platform metadata.
    value: $(steps.export.results.BUILD_ARTIFACT)
  stepTemplate:
    securityContext:
      runAsUser: 1000
      runAsGroup: 0
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
  volumes:
  - name: workdir
    emptyDir: {}
  - name: build-output
    emptyDir: {}
  - name: registry-auth
    secret:
      secretName: byob-registry-auth
      optional: true
      items:
      - key: .dockerconfigjson
        path: config.json
  steps:
  - name: restore
    image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:adf22f3ec90bfa3f7e2c832a7d52febd1ea31aa9fff6db21324c965d7d622327
    args:
    - use
    - $(params.SOURCE_ARTIFACT)=/var/workdir/source
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
    - name: registry-auth
      mountPath: /var/run/byob-registry-auth
      readOnly: true
    env:
    - name: AUTHFILE
      value: /var/run/byob-registry-auth/config.json
  - name: restore-inputs
    image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:adf22f3ec90bfa3f7e2c832a7d52febd1ea31aa9fff6db21324c965d7d622327
    args:
    - $(params.BUILD_ARTIFACTS[*])
    script: |
      #!/bin/bash
      set -euo pipefail
      mkdir -p /var/workdir/inputs
      index=0
      for artifact in "$@"; do
          [[ "$artifact" =~ ^oci:.+@sha256:[a-f0-9]{64}$ ]] || { echo 'Invalid build artifact reference' >&2; exit 1; }
          destination="/var/workdir/inputs/$index"
          mkdir -p "$destination"
          /usr/local/bin/use-archive "$artifact=$destination"
          index=$((index + 1))
      done
    env:
    - name: AUTHFILE
      value: /var/run/byob-registry-auth/config.json
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
    - name: registry-auth
      mountPath: /var/run/byob-registry-auth
      readOnly: true
  - name: prepare
    image: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
    script: |
      #!/usr/bin/env python3
      """Validate the restored source and selected script before execution."""
      import os
      from pathlib import Path
      import stat
      import sys


      def safe_relative(value):
          path = Path(value)
          if not value or path.is_absolute() or ".." in path.parts:
              raise ValueError(f"expected a relative path without '..': {value!r}")
          return path


      def check_tree(root):
          if root.is_symlink() or not root.is_dir():
              raise ValueError(f"expected a real directory: {root}")
          root = root.resolve(strict=True)
          for directory, dirs, files in os.walk(root, followlinks=False):
              for name in dirs + files:
                  path = Path(directory) / name
                  mode = path.lstat().st_mode
                  if stat.S_ISLNK(mode):
                      # Absolute links would point somewhere different after extraction.
                      target = os.readlink(path)
                      if os.path.isabs(target) or not path.resolve().is_relative_to(root):
                          raise ValueError(f"symlink escapes artifact: {path}")
                  elif not (stat.S_ISREG(mode) or stat.S_ISDIR(mode)):
                      raise ValueError(f"unsupported special file: {path}")


      def main():
          source = Path(os.environ["SOURCE_ROOT"])
          check_tree(source)
          relative = safe_relative(os.environ["SCRIPT_PATH"])
          script = (source / relative).resolve(strict=True)
          if not script.is_relative_to(source.resolve()) or not script.is_file():
              raise ValueError("script must be a file inside the source tree")
          if not os.access(script, os.X_OK):
              raise ValueError("script must be executable and have an interpreter shebang")
          with script.open("rb") as contents:
              if contents.read(2) != b"#!":
                  raise ValueError("script must have an interpreter shebang")


      if __name__ == "__main__":
          try:
              main()
          except (OSError, ValueError, RuntimeError) as error:
              sys.exit(f"source validation failed: {error}")
    env:
    - name: SOURCE_ROOT
      value: /var/workdir/source
    - name: SCRIPT_PATH
      value: $(params.script-path)
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
  - name: build
    image: $(params.image)
    command:
    - /bin/sh
    args:
    - -eu
    - -c
    - mkdir -p "$HOME"; cd source; exec "./$1"
    - run-build
    - $(params.script-path)
    workingDir: /var/workdir
    env:
    - name: HOME
      value: /tmp/byob-home
    - name: BUILD_INPUTS
      value: /var/workdir/inputs
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
    computeResources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        memory: 2Gi
  - name: validate-output
    image: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
    script: |
      #!/usr/bin/env python3
      """Stage only build outputs in a volume inaccessible to the developer step."""
      import os
      from pathlib import Path
      import re
      import shutil
      import stat
      import sys


      def safe_relative(value):
          path = Path(value)
          if not value or path.is_absolute() or ".." in path.parts:
              raise ValueError(f"expected a relative path without '..': {value!r}")
          return path


      def check_tree(root):
          if root.is_symlink() or not root.is_dir():
              raise ValueError(f"expected a real directory: {root}")
          root = root.resolve(strict=True)
          for directory, dirs, files in os.walk(root, followlinks=False):
              for name in dirs + files:
                  path = Path(directory) / name
                  mode = path.lstat().st_mode
                  if stat.S_ISLNK(mode):
                      # Absolute links would point somewhere different after extraction.
                      target = os.readlink(path)
                      if os.path.isabs(target) or not path.resolve().is_relative_to(root):
                          raise ValueError(f"symlink escapes artifact: {path}")
                  elif not (stat.S_ISREG(mode) or stat.S_ISDIR(mode)):
                      raise ValueError(f"unsupported special file: {path}")


      def main():
          source = Path(os.environ["SOURCE_ROOT"])
          if source.is_symlink() or not source.is_dir():
              raise ValueError("source must remain a real directory")
          output = source / "out"
          check_tree(output)
          if not any(p.is_file() and not p.is_symlink() for p in output.rglob("*")):
              raise ValueError("out/ must contain at least one regular file")
          platform = os.environ.get("BUILD_PLATFORM", "")
          if platform:
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_./-]*", platform):
                  raise ValueError("invalid platform label")
              safe_relative(platform)
          artifact = Path(os.environ["ARTIFACT_ROOT"])
          shutil.copytree(output, artifact / "out", symlinks=True)
          if platform:
              (artifact / ".konflux-platform").write_text(platform + "\n")


      if __name__ == "__main__":
          try:
              main()
          except (OSError, ValueError, RuntimeError) as error:
              sys.exit(f"output validation failed: {error}")
    env:
    - name: SOURCE_ROOT
      value: /var/workdir/source
    - name: ARTIFACT_ROOT
      value: /var/build-output
    volumeMounts:
    - name: workdir
      mountPath: /var/workdir
      readOnly: true
    - name: build-output
      mountPath: /var/build-output
  - name: export
    image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:adf22f3ec90bfa3f7e2c832a7d52febd1ea31aa9fff6db21324c965d7d622327
    args:
    - create
    - --store
    - $(params.ociStorage):$(context.taskRun.name)
    - $(step.results.BUILD_ARTIFACT.path)=/var/build-output
    results:
    - name: BUILD_ARTIFACT
      type: string
    env:
    - name: AUTHFILE
      value: /var/run/byob-registry-auth/config.json
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.ociArtifactExpiresAfter)
    volumeMounts:
    - name: build-output
      mountPath: /var/build-output
      readOnly: true
    - name: registry-auth
      mountPath: /var/run/byob-registry-auth
      readOnly: true
